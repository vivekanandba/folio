name: PR gate

# Catch what the offline dev box can't: type errors (tsc), plus the full
# test suite and content lint — BEFORE merge, not after. pages.yml remains
# the post-merge deploy; this is the pre-merge quality gate.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint content
        run: npm run lint:content
      # Coverage floor, not just a pass/fail suite. The denominator is the whole
      # of src/ (tests/import-all.test.ts forces every module to load), so this
      # number cannot be flattered by only measuring the files a test imported.
      - name: Test + coverage floor
        run: npm run test:gate
      - name: Typecheck + build
        run: npm run build

  # Boot smoke: the blank-page bug class (layout feedback loops, dead module
  # graphs, missing furniture) that lint/tsc/unit tests can't see.
  smoke:
    runs-on: ubuntu-latest # ships with google-chrome preinstalled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Boot smoke over key routes
        run: npm run smoke

  # Can it be INSTALLED on a phone, and does it work on a plane? Neither
  # question is answerable from unit tests or a boot check. Screenshot
  # comparison runs informationally here (CI's Chrome renders differently
  # from the machine that committed the baselines) and is uploaded instead.
  e2e:
    runs-on: ubuntu-latest # ships with google-chrome preinstalled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Installability, offline, screenshots
        run: npm run e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/baselines/*.png
          if-no-files-found: error
