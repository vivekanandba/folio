name: PR gate

# Catch what the offline dev box can't: type errors (tsc), plus the full
# test suite and content lint — BEFORE merge, not after. pages.yml remains
# the post-merge deploy; this is the pre-merge quality gate.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # tools/check_specs.py is vendored from the spec-check skill because
      # Actions cannot read ~/.claude/skills. Re-run `--install .` when the
      # skill changes; the copy does not update itself (CON-VER-004).
      - name: Spec registry
        run: python3 tools/check_specs.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint content
        run: npm run lint:content
      # The dark theme's contrast was checked by hand before commits and never
      # by anything automatic. It now reads its palette from style.css, so it
      # cannot pass against a stale copy of the colours.
      - name: Contrast (WCAG) of the palette
        run: python3 tools/contrast.py
      # Coverage floor, not just a pass/fail suite. The denominator is the whole
      # of src/ (tests/import-all.test.ts forces every module to load), so this
      # number cannot be flattered by only measuring the files a test imported.
      - name: Test + coverage floor
        run: npm run test:gate
      # Build exactly what deploys (base /folio/), not the dev-base build —
      # a base-path defect is invisible until it is served from a subdirectory.
      - name: Typecheck + build
        run: npm run pages:build
      - name: Verify the built artifact
        run: node tools/verify-build.mjs dist --base /folio/

  # Boot smoke: the blank-page bug class (layout feedback loops, dead module
  # graphs, missing furniture) that lint/tsc/unit tests can't see.
  smoke:
    runs-on: ubuntu-latest # ships with google-chrome preinstalled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Boot smoke over key routes
        run: npm run smoke

  # Can it be INSTALLED on a phone, does it work on a plane, and does it still
  # look the same? None of those is answerable from unit tests or a boot check.
  # Screenshot comparison GATES here now, because this job runs the same pinned
  # browser the baselines were captured with.
  e2e:
    runs-on: ubuntu-latest
    # Pinned browser, so the visual baselines are comparable to what runs here.
    # They are captured in this same image; the hosted runner's own Chrome
    # drifted 1.1-4.9% against them, which is why the check used to be
    # informational in CI. The image has node and the suite has no npm
    # dependencies, so there is nothing to install.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@v4
      - name: Installability, offline, screenshots
        run: node tools/e2e/run.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/baselines/*.png
          if-no-files-found: error

  # Combined coverage: unit + what a real browser executed, unioned into the
  # unit run's line set. WebGL, pointer handling and the animation loop cannot
  # run under the DOM stub, so a unit-only figure permanently understates them.
  coverage:
    runs-on: ubuntu-latest # ships with google-chrome preinstalled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Combined coverage floor
        id: cov
        run: npm run coverage:gate
      # Does a .coverage directory exist at all? Asked by LOOKING, in a step
      # that always() guarantees will run, rather than by reasoning about
      # whether `steps.cov.conclusion` is populated for a step that an earlier
      # failure skipped. Review raised that as an open question and I could
      # not settle it from the docs either; a gate whose correctness nobody
      # can state is not a gate (CON-VER-006 — check the thing you can
      # execute, rather than deriving it).
      - name: Did coverage produce anything
        id: lcov
        if: always()
        run: |
          if [ -d .coverage ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload lcov
        # always(), so a FAILING coverage run still uploads its lcov — that is
        # the run whose numbers someone wants to read. But not when the step
        # that writes .coverage never ran: if checkout, setup-node or npm ci
        # fails, a bare always() still fires this upload, which then goes red
        # with "No files were found with the provided path" — a second failed
        # step naming a cause that is not the cause, pointing whoever reads
        # the log at the artifact glob instead of at the broken install
        # (CON-VER-005). With the directory checked directly,
        # if-no-files-found: error stays strict for the case it was added
        # for: .coverage present but the glob matching nothing.
        if: always() && steps.lcov.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          # include-hidden-files, because `.coverage` starts with a dot and
          # upload-artifact@v4 skips hidden paths by DEFAULT. This step has
          # been uploading nothing since it was written — the job log says
          # "No files were found with the provided path" — and
          # if-no-files-found: warn kept it green while it did. Widening the
          # glob from *.lcov did not help; the dot was the problem.
          #
          # *.lcov, NOT * — the glob has to be able to fail.
          #
          # `.coverage/*` can no longer match nothing whenever the directory
          # exists: coverage:all starts `mkdir -p .coverage && { npm run
          # coverage:unit >.coverage/unit.log ...`, and the shell creates
          # unit.log the instant it opens that redirect. So a run where the
          # lcov writes silently stopped producing a file would upload two
          # LOG files, go green, and leave if-no-files-found: error reading
          # as a guarantee it no longer gave (CON-VER-005). Narrowing it back
          # to the artifact that matters restores the meaning the strictness
          # claims. The logs go up separately, below, where their absence is
          # genuinely not an error.
          path: .coverage/*.lcov
          # include-hidden-files, because `.coverage` starts with a dot and
          # upload-artifact@v4 skips hidden paths by DEFAULT. This step
          # uploaded nothing for weeks — the job log says "No files were
          # found with the provided path" — and if-no-files-found: warn kept
          # it green while it did. The dot was the problem, not the glob.
          include-hidden-files: true
          # error, not warn. `warn` is what kept this step green for weeks
          # while it uploaded nothing — fixing the no-op and leaving the thing
          # that hid it would invite the next one (CON-PROC-003). The sibling
          # upload at the e2e job already uses error.
          if-no-files-found: error
      - name: Upload coverage logs
        # Separate, and deliberately NOT strict: coverage:all cats a failing
        # run's log into the job output already, so this is the convenience
        # copy. Holding it to `error` would be the same mistake in reverse —
        # a red step for something that is not a failure.
        if: always() && steps.lcov.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-logs
          path: .coverage/*.log
          include-hidden-files: true
          if-no-files-found: warn
